<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SecureShare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <i class="bi bi-shield-lock-fill"></i> SecureShare
            </a>

            <a href="register.html" class="nav-login">
                Create Account
            </a>
        </div>
    </nav>


    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-icon">
                <i class="bi bi-person-fill-lock"></i>
            </div>

            <h2>Welcome Back!</h2>

            <p class="auth-subtitle">
                Login to access your secure files.
            </p>

            <div id="messageBox"></div>

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label">Email Address</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>


                <div class="mb-4">
                    <label class="form-label">Password</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                </div>


                <button type="submit" class="btn btn-primary auth-btn" id="loginBtn">
                    Login
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>


            <div class="auth-footer">
                Don't have an account?
                <a href="register.html">Register here</a>
            </div>

            <div class="secure-note">
                <i class="bi bi-shield-check"></i>
                Secure access to your personal files.
            </div>

        </div>

    </section>


    <script src="js/auth.js"></script>

</body>
</html>
